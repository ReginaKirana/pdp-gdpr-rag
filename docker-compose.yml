services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

  app:
    build: .
    ports:
      - "7860:7860"
    environment:
      QDRANT_URL: http://qdrant:6333
      # Ollama runs on the host (GPU access on macOS), not in a container
      OLLAMA_URL: http://host.docker.internal:11434/api/chat
      DEVICE: cpu
    volumes:
      - ./data/processed:/app/data/processed:ro
      # reuse the bge-m3 download already cached on the host (~2 GB)
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
